<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Equipment Registration</title>
</head>
<body>
  <h1>Register Team</h1>
  <form id="equipoForm">
    <input type="text" id="id" placeholder="ID of team" required><br>
    <input type="text" id="name" placeholder="Name of team" required><br>
    <input type="number" id="win" placeholder="Matches won" required><br>
    <input type="number" id="totalmatches" placeholder="Total Matches" required><br>
    <button type="submit">Save</button>
  </form>

  <div id="result"></div>

  <script src="Soccer Teams.js"></script>
</body>
</html>
