<!DOCTYPE html>
<html>
<head>
    <title>Microphone Data Entry</title>
    <style>
        form {
            width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <form id="microphoneForm">
        <h2>Add New Microphone</h2>
        
        <div class="form-group">
            <label for="id">ID:</label>
            <input type="text" id="id" name="id" required placeholder="e.g. 001">
        </div>
        
        <div class="form-group">
            <label for="brand">Brand:</label>
            <input type="text" id="brand" name="brand" required placeholder="e.g. Shure">
        </div>
        
        <div class="form-group">
            <label for="model">Model:</label>
            <input type="text" id="model" name="model" required placeholder="e.g. SM58">
        </div>
        
        <div class="form-group">
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="">Select type</option>
                <option value="Dynamic">Dynamic</option>
                <option value="Condenser">Condenser</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="color">Color:</label>
            <input type="text" id="color" name="color" required placeholder="e.g. Black">
        </div>
        
        <div class="form-group">
            <label for="connection">Connection:</label>
            <select id="connection" name="connection" required>
                <option value="">Select connection</option>
                <option value="XLR">XLR</option>
                <option value="USB">USB</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="frequency">Frequency Range:</label>
            <input type="text" id="frequency" name="frequency" required placeholder="e.g. 50Hz-15kHz">
        </div>
        
        <div class="form-group">
            <label for="sensitivity">Sensitivity:</label>
            <input type="text" id="sensitivity" name="sensitivity" required placeholder="e.g. -54dB">
        </div>
        
        <div class="form-group">
            <label for="impedance">Impedance:</label>
            <input type="text" id="impedance" name="impedance" required placeholder="e.g. 150 ohms">
        </div>
        
        <div class="form-group">
            <label for="price">Price ($):</label>
            <input type="number" id="price" name="price" step="0.01" required placeholder="e.g. 99.99">
        </div>
        
        <button type="submit">Add Microphone</button>
        
        <div id="message"></div>
    </form>

    <script>
        document.getElementById('microphoneForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                id: document.getElementById('id').value,
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                type: document.getElementById('type').value,
                color: document.getElementById('color').value,
                connection: document.getElementById('connection').value,
                frequency: document.getElementById('frequency').value,
                sensitivity: document.getElementById('sensitivity').value,
                impedance: document.getElementById('impedance').value,
                price: parseFloat(document.getElementById('price').value)
            };
            
            try {
                const response = await fetch('http://localhost:3000/add-microphone', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                const messageDiv = document.getElementById('message');
                if (response.ok) {
                    messageDiv.textContent = 'Microphone added successfully!';
                    messageDiv.style.display = 'block';
                    messageDiv.style.backgroundColor = '#dff0d8';
                    messageDiv.style.color = '#3c763d';
                    document.getElementById('microphoneForm').reset();
                    
                    setTimeout(() => {
                        messageDiv.style.display = 'none';
                    }, 3000);
                } else {
                    messageDiv.textContent = `Error: ${result.error || 'Failed to add microphone'}`;
                    messageDiv.style.display = 'block';
                    messageDiv.style.backgroundColor = '#f2dede';
                    messageDiv.style.color = '#a94442';
                }
            } catch (error) {
                console.error('Error:', error);
                const messageDiv = document.getElementById('message');
                
                let errorMessage = error.message;
                if (error.message.includes('Failed to fetch')) {
                    errorMessage = 'Could not connect to server. Please check:';
                    errorMessage += '\n1. Server is running (node server.js)';
                    errorMessage += '\n2. Correct URL';
                    errorMessage += '\n3. Network connection';
                }
                
                messageDiv.innerHTML = errorMessage.replace(/\n/g, '<br>');
                messageDiv.style.display = 'block';
                messageDiv.style.backgroundColor = '#f2dede';
                messageDiv.style.color = '#a94442';
            }
        });
    </script>
</body>
</html>
