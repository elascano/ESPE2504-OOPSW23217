<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTax Singleton Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tax Calculator</h1>
        
        <div class="form-group">
            <label for="amount">Sale Amount ($):</label>
            <input type="number" id="amount" step="0.01" min="0">
        </div>
        
        <div class="form-group">
            <label for="tax-percentage">Tax Percentage (Current: <span id="current-tax"></span>%):</label>
            <input type="number" id="tax-percentage" step="0.1" min="0" max="100" value="7.0">
        </div>
        
        <button id="calculate">Calculate Total</button>
        
        <div id="result" class="result"></div>
    </div>

    <script src="js/USTax.js"></script>
    <script src="js/Calculator.js"></script>
</body>
</html>
