<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Forniture by id</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        label,
        input,
        button {
            display: block;
            margin: 8px 0;
        }

        .forniture {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1>Forniture by id</h1>
    <div id="fornitureList"></div>

    <script>
        const apiBase = '/api/forniture';

        async function fetchForniture() {
            const res = await fetch(apiBase);
            const forniture = await res.json();
            const container = document.getElementById('fornitureList');
            container.innerHTML = '';
            forniture.forEach(c => {
                const div = document.createElement('div');
                div.className = 'forniture';
                div.innerHTML = `
          <strong>ID:</strong> ${c.id || c._id} <br/>
          <strong>Name:</strong> ${c.name} cm<br/>
          <strong>Quality:</strong> ${c.quality} cm<br/>
          <strong>Value:</strong> ${c.value}<br/>
        `;
                container.appendChild(div);
            });
        }

        fetchCellphones();
    </script>
</body>

</html>
